<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma para Afiliados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css"> <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">
    <section id="login-section" class="container mx-auto mt-10 p-6 bg-white rounded shadow-md" style="display: none;">
        <h1 class="text-2xl font-semibold text-gray-800 mb-4">Iniciar Sesión</h1>
        <div id="login-error" class="text-red-500 text-sm mb-2" style="display: none;"></div>
        <input type="text" id="username" placeholder="Ingrese su usuario" class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent mb-3">
        <input type="password" id="password" placeholder="Ingrese su contraseña" class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent mb-4">
        <button id="login-button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Iniciar Sesión</button>
    </section>

    <section id="master-supervisor-panel" class="container mx-auto mt-10" style="display: none;">
        <h1 class="text-2xl font-semibold text-gray-800 mb-4">Panel de Master/Supervisor</h1>

        <section id="user-management" class="bg-white rounded shadow-md p-6 mb-8" style="display: none;">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Gestión de Usuarios</h2>
            <div id="user-message" class="text-green-500 text-sm mb-2" style="display: none;"></div>
            <div class="flex space-x-4 mb-4">
                <input type="text" id="new-username" placeholder="Nuevo Usuario" class="w-1/3 px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <input type="password" id="new-password" placeholder="Nueva Contraseña" class="w-1/3 px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <select id="new-role" class="w-1/3 px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="supervisor">Supervisor</option>
                    <option value="vendedor">Vendedor</option>
                </select>
            </div>
            <button id="create-user-button" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Crear Usuario</button>
        </section>

        <section class="bg-white rounded shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Subir Nuevo Producto</h2>
            <div id="form-message" class="text-green-500 text-sm mb-2" style="display: none;"></div>
            <div class="mb-4">
                <label for="product-name" class="block text-gray-700 text-sm font-bold mb-2">Nombre del Producto:</label>
                <input type="text" id="product-name" class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            <div class="mb-4">
                <label for="product-description" class="block text-gray-700 text-sm font-bold mb-2">Descripción del Producto:</label>
                <textarea id="product-description" class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent h-32 resize-y"></textarea>
            </div>
            <div class="mb-4 flex space-x-4">
                <div class="w-1/2">
                    <label for="suggested-price" class="block text-gray-700 text-sm font-bold mb-2">Precio Sugerido:</label>
                    <input type="number" id="suggested-price" class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="w-1/2">
                    <label for="affiliate-price" class="block text-gray-700 text-sm font-bold mb-2">Precio Afiliado:</label>
                    <input type="number" id="affiliate-price" class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
            </div>
            <div class="mb-4">
                <label for="product-images" class="block text-gray-700 text-sm font-bold mb-2">Imágenes del Producto:</label>
                <input type="file" id="product-images" multiple accept="image/*" class="w-full">
                <div id="images-preview-container" class="mt-2">
                    </div>
            </div>
            <button id="publish-button" class="bg-indigo-500 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Publicar Artículo</button>
        </section>

        <section id="product-management" class="bg-white rounded shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Lista de Productos</h2>
            <div id="product-list" class="grid-container">
                </div>
        </section>
    </section>

    <section id="affiliate-panel" class="container mx-auto mt-10" style="display: none;">
        <h1 class="text-2xl font-semibold text-gray-800 mb-4">Panel de Afiliado</h1>

        <section id="published-products" class="bg-white rounded shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Productos que ya has publicado</h2>
            <div id="affiliate-published-list" class="grid-container">
                </div>
        </section>

        <section class="bg-white rounded shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Productos para que promociones</h2>
            <div id="affiliate-product-list" class="grid-container">
                </div>
        </section>

        <section class="bg-white rounded shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Productos Aleatorios para Publicar</h2>
            <div id="random-product-list" class="grid-container">
                </div>
        </section>
    </section>

    <script src="script.js"></script> </body>
</html>
