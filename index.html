<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 font-inter">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-semibold text-gray-800 text-center mb-6">Catálogo de Productos</h1>

        <div id="login-section" class="card">
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Inicio de Sesión</h2>
            <div class="mb-4">
                <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Usuario:</label>
                <input type="text" id="username" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Ingrese su usuario">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Contraseña:</label>
                <input type="password" id="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Ingrese su contraseña">
            </div>
            <button id="login-button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Iniciar Sesión</button>
            <div id="login-error" class="mt-4 text-red-500 text-xs italic" style="display: none;"></div>
        </div>

        <div id="master-supervisor-panel" class="hidden">
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Panel de Master/Supervisor</h2>

            <div id="product-form" class="card">
                <h3 class="text-xl font-semibold text-gray-600 mb-4">Subir Nuevo Artículo</h3>
                <div class="mb-4">
                    <label for="product-name" class="block text-gray-700 text-sm font-bold mb-2">Nombre del Producto:</label>
                    <input type="text" id="product-name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Ingrese nombre del producto">
                </div>
                <div class="mb-4">
                    <label for="product-description" class="block text-gray-700 text-sm font-bold mb-2">Descripción:</label>
                    <textarea id="product-description" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline h-32 resize-y" placeholder="Ingrese descripción del producto"></textarea>
                </div>
                <div class="mb-4">
                    <label for="suggested-price" class="block text-gray-700 text-sm font-bold mb-2">Precio Sugerido:</label>
                    <input type="number" id="suggested-price" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Ingrese precio sugerido" min="0" step="0.01">
                </div>
                <div class="mb-4">
                    <label for="affiliate-price" class="block text-gray-700 text-sm font-bold mb-2">Precio Afiliado:</label>
                    <input type="number" id="affiliate-price" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Ingrese precio afiliado" min="0" step="0.01">
                </div>
                <div class="mb-4">
                    <label for="product-images" class="block text-gray-700 text-sm font-bold mb-2">Imágenes del Producto:</label>
                    <input type="file" id="product-images" multiple class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" accept="image/*">
                    <div id="images-preview-container" class="mt-2">
                      </div>
                </div>
                <button id="publish-button" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Publicar Artículo</button>
                <div id="form-message" class="mt-4 text-green-500 text-xs italic" style="display: none;"></div>
            </div>

            <div id="product-management" class="card mt-8">
                <h3 class="text-xl font-semibold text-gray-600 mb-4">Administración de Artículos</h3>
                <div id="product-list" class="grid-container">
                    </div>
            </div>

            <div id="user-management" class="card mt-8">
                <h3 class="text-xl font-semibold text-gray-600 mb-4">Gestión de Usuarios</h3>
                <div class="mb-4">
                    <label for="new-username" class="block text-gray-700 text-sm font-bold mb-2">Nombre de Usuario:</label>
                    <input type="text" id="new-username" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Ingrese nombre de usuario">
                </div>
                <div class="mb-4">
                    <label for="new-password" class="block text-gray-700 text-sm font-bold mb-2">Contraseña:</label>
                    <input type="password" id="new-password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Ingrese contraseña">
                </div>
                <div class="mb-4">
                    <label for="new-role" class="block text-gray-700 text-sm font-bold mb-2">Rol:</label>
                    <select id="new-role" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        <option value="affiliate">Afiliado</option>
                        <option value="supervisor">Supervisor</option>
                    </select>
                </div>
                <button id="create-user-button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Crear Usuario</button>
                <div id="user-message" class="mt-4 text-green-500 text-xs italic" style="display: none;"></div>
            </div>
        </div>

        <div id="affiliate-panel" class="hidden">
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Panel de Afiliado</h2>

            <div id="not-published-products" class="card">
              <h3 class="text-xl font-semibold text-gray-600 mb-4">Productos para Publicar</h3>
              <div id="random-product-list" class="grid-container">
                </div>
            </div>

            <div id="product-catalog" class="card mt-8">
                <h3 class="text-xl font-semibold text-gray-600 mb-4">Catálogo de Productos</h3>
                <div id="affiliate-product-list" class="grid-container">
                    </div>
            </div>

            <div id="published-products" class="card mt-8">
                <h3 class="text-xl font-semibold text-gray-600 mb-4">Artículos Publicados</h3>
                <div id="affiliate-published-list" class="grid-container">
                    </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
