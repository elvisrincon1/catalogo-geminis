<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Afiliados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .descripcion-producto {
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Mostrar solo 2 líneas */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .image-preview {
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 10px;
            width: 100px; /* Ajusta el tamaño según tus necesidades */
            height: 100px;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }
        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-gray-100">
    <header class="bg-purple-600 text-white py-4">
        <div class="container mx-auto px-4">
            <h1 class="text-3xl font-semibold text-center">Plataforma de Afiliados</h1>
        </div>
    </header>

    <main class="container mx-auto py-6 px-4">
        <section id="login-section" class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4 text-center">Inicio de Sesión</h2>
            <div class="mb-4">
                <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Nombre de Usuario:</label>
                <input type="text" id="username" name="username" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Contraseña:</label>
                <input type="password" id="password" name="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <p id="login-error" class="text-red-500 text-xs italic mb-4" style="display: none;"></p>
            <button id="login-button" class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">Iniciar Sesión</button>
        </section>

        <section id="master-supervisor-panel" class="bg-white rounded-lg shadow-md p-6 mb-6" style="display: none;">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Panel de Master/Supervisor</h2>

            <section id="user-management" style="display: none;" class="mb-8">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Gestión de Usuarios</h3>
                <div class="mb-4">
                    <label for="new-username" class="block text-gray-700 text-sm font-bold mb-2">Nombre de Usuario:</label>
                    <input type="text" id="new-username" name="new-username" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div class="mb-4">
                    <label for="new-password" class="block text-gray-700 text-sm font-bold mb-2">Contraseña:</label>
                    <input type="password" id="new-password" name="new-password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div class="mb-4">
                    <label for="new-role" class="block text-gray-700 text-sm font-bold mb-2">Rol:</label>
                    <select id="new-role" name="new-role" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        <option value="affiliate">Afiliado</option>
                        <option value="supervisor">Supervisor</option>
                        <option value="master">Master</option>
                    </select>
                </div>
                <button id="create-user-button" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mb-4">Crear Usuario</button>
                <p id="user-message" class="text-green-500 text-xs italic mb-4" style="display: none;"></p>
                <button id="view-users-button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mb-4">Ver lista de Usuarios</button>
                <ul id="user-list" class="border rounded p-4">
                    </ul>
            </section>

            <section id="product-upload-form" class="mb-8">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Subir Nuevo Producto</h3>
                <div class="mb-4">
                    <label for="product-name" class="block text-gray-700 text-sm font-bold mb-2">Nombre del Producto:</label>
                    <input type="text" id="product-name" name="product-name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div class="mb-4">
                    <label for="product-description" class="block text-gray-700 text-sm font-bold mb-2">Descripción del Producto:</label>
                    <textarea id="product-description" name="product-description" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"></textarea>
                </div>
                <div class="mb-4">
                    <label for="suggested-price" class="block text-gray-700 text-sm font-bold mb-2">Precio Sugerido:</label>
                    <input type="number" id="suggested-price" name="suggested-price" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div class="mb-4">
                    <label for="affiliate-price" class="block text-gray-700 text-sm font-bold mb-2">Precio para Afiliado:</label>
                    <input type="number" id="affiliate-price" name="affiliate-price" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div class="mb-4">
                    <label for="product-images" class="block text-gray-700 text-sm font-bold mb-2">Imágenes del Producto:</label>
                    <input type="file" id="product-images" name="product-images" multiple accept="image/*" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    <div id="images-preview-container" class="mt-2 flex flex-wrap">
                        </div>
                </div>
                <button id="publish-button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Publicar Artículo</button>
                <p id="form-message" class="text-green-500 text-xs italic mt-4" style="display: none;"></p>
            </section>

            <section id="product-management" class="mb-8">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Productos Subidos</h3>
                <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    </div>
            </section>
             <button id="logout-button" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Cerrar Sesión</button>
        </section>

        <section id="affiliate-panel" class="bg-white rounded-lg shadow-md p-6 mb-6" style="display: none;">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Panel de Afiliado</h2>

            <section id="affiliate-products" class="mb-8">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Productos Disponibles para Afiliados</h3>
                <div id="affiliate-product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    </div>
            </section>

            <section id="published-products" class="mb-8" style="display: none;">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Productos que ya has publicado</h3>
                <ul id="affiliate-published-list" class="border rounded p-4">
                    </ul>
            </section>

            <section id="random-products" class="mb-8">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Productos Aleatorios (Máximo 5)</h3>
                <div id="random-product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    </div>
            </section>
             <button id="logout-button" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Cerrar Sesión</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
